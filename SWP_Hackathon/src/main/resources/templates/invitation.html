<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lời Mời Tham Gia Đội Thi</title>
</head>
<body>

<h2>FPT HACKATHON</h2>

<p>
    Xin chào <span th:text="${studentName}">Sinh viên</span>,
    <br>
    Bạn đã nhận được lời mời tham gia đội thi từ
    <span th:text="${leaderName}">Leader</span>.
</p>

<p>
    <strong>Tên đội:</strong>
    <span th:text="${teamName}">Tên Đội</span>
</p>

<p>
    Hãy xác nhận tham gia hoặc từ chối lời mời bằng cách chọn một trong hai liên kết bên dưới:
</p>

<p>
    <a th:href="'http://localhost:5174/respond-invitation?id=' + ${invitationId} + '&action=accept'">
        Phản hồi lời mời tham gia đội thi
    </a>
</p>

<p>
    Trân trọng,<br>
    FPT Hackathon System
</p>

</body>
</html>
