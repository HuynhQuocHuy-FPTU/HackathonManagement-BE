
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lời mời tham gia đội</title>
</head>

<body style="font-family: Arial; background-color: #f4f6f8; padding: 40px 20px;">

<div style="max-width: 600px; margin: auto; background: #fff; border-radius: 10px; border-top: 5px solid #28a745;">

    <!-- HEADER -->
    <div style="padding: 20px; text-align: center; border-bottom: 1px solid #eee;">
        <h2 style="margin: 0; color: #28a745;">HỆ THỐNG HACKATHON</h2>
    </div>

    <!-- CONTENT -->
    <div style="padding: 25px;">

        <p>Xin chào bạn,</p>

        <p>
            Bạn vừa nhận được lời mời từ trưởng nhóm
            <b style="color: #28a745;" th:text="${leaderName}">Leader Name</b>
        </p>

        <div style="margin: 20px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #28a745;">
            <p style="margin: 0; font-size: 14px;">Đội ngũ mời bạn:</p>
            <h3 style="margin: 5px 0 0;" th:text="${teamName}">Team Name</h3>
        </div>

        <p>
            Vui lòng đăng nhập hệ thống để xác nhận tham gia đội trước thời hạn.
        </p>

        <p>Chúc bạn thi tốt</p>

    </div>

    <!-- FOOTER -->
    <div style="padding: 15px; text-align: center; font-size: 12px; color: #888;">
        Email tự động từ hệ thống Hackathon
    </div>

</div>

</body>
</html>
