<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lời mời nhận chức Trưởng nhóm</title>
</head>

<body style="font-family: Arial; background:#f4f6f8; padding:40px 20px;">

<div style="max-width:600px; margin:auto; background:#fff; border-radius:10px; border-top:5px solid #007bff;">

    <!-- HEADER -->
    <div style="padding:20px; text-align:center; border-bottom:1px solid #e1e1e1; background:#f4f9ff;">
        <h2 style="margin:0; color:#0056b3;">HỆ THỐNG HACKATHON</h2>
    </div>

    <!-- CONTENT -->
    <div style="padding:25px;">

        <p>
            Thân gửi <b style="color:#007bff;" th:text="${studentName}">Student</b>,
        </p>

        <p>
            Bạn được đề xuất trở thành <b>Trưởng nhóm (Leader)</b> trong hệ thống.
        </p>

        <div style="margin:20px 0; padding:15px; background:#f9f9f9; border-left:4px solid #007bff;">
            <p style="margin:0; font-size:14px;">Tên đội:</p>
            <h3 style="margin:5px 0 0; color:#0056b3;" th:text="${teamName}">Team Name</h3>
        </div>

        <p>
            Quyền trưởng nhóm chỉ có hiệu lực sau khi bạn xác nhận trong hệ thống.
        </p>

        <p>
            Trân trọng,<br>
            <b>Ban tổ chức Hackathon</b>
        </p>

    </div>

    <!-- FOOTER -->
    <div style="padding:15px; text-align:center; font-size:12px; color:#888;">
        Email tự động từ hệ thống Hackathon
    </div>

</div>

</body>
</html>
